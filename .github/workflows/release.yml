name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install native ALSA build dependencies
        run: sudo apt-get update && sudo apt-get install --yes alsa-utils libasound2-dev pkg-config

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Verify source
        run: make check

      - name: Verify tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(make version)"

      - name: Build release archive
        run: make package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/alsachain-*-linux-x86_64.tar.gz
            dist/SHA256SUMS
